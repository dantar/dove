name: dove

services:

  nginx:
    image: nginx:alpine
    container_name: dove
    volumes:
      - ./html:/usr/share/nginx/html:ro
    networks:
      - proxy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    expose:
      - 80
    environment:
      - APP_URL=https://dove.dantar.it
      - BACKEND_URL=/backend
      - IMAGES_URL=/images
    volumes:
      - ./frontend/logs/nginx:/var/log/nginx/
    networks:
      - proxy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    expose:
      - 8080
    environment:
      APP_URL: https://dove.dantar.it
      DEPS_DB_URL: database:5432
      DEPS_DB_DBNAME: dove
      DEPS_DB_PASSWORD: dove
      DEPS_DB_USERNAME: dove
      APP_PICTURES_DIR: /data
      LOGGING_FILE_NAME: /logs/backend.log
    networks:
      - proxy
      - dove
    volumes:
      - ./backend/data/images:/data
      - ./backend/data/logs:/logs
    depends_on:
      database:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully

  database:
    build:
      context: ./database/
      dockerfile: ./Dockerfile
    expose:
      - 5432
    environment:
      LANG: it_IT.utf8
      POSTGRES_DB: dove
      POSTGRES_USER: dove
      POSTGRES_PASSWORD: dove
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=it_IT.utf8"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dove"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dove
    volumes:
      - ./database/dbdump:/dbdump
      - ./database/data/postgresql:/var/lib/postgresql
      - ./database/init:/docker-entrypoint-initdb.d:ro

  flyway:
    image: flyway/flyway:11
    depends_on:
      database:
        condition: service_healthy
    networks:
      - dove
    volumes:
      - ./flyway/sql:/flyway/sql:ro
    command: >
      -url=jdbc:postgresql://database:5432/dove
      -user=dove
      -password=dove
      -baselineOnMigrate=true
      migrate

networks:
  proxy:
    external: true
  dove:
    driver: bridge
