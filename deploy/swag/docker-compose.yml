# edit in /opt/swag/docker-compose.yml
name: swag

services:

  swag:
    image: lscr.io/linuxserver/swag:5.7.0-ls474
    container_name: swag

    cap_add:
      - NET_ADMIN

    environment:
      - PUID=1001
      - PGID=1001
      - TZ=Europe/Rome

      - URL=dantar.it
      - EXTRA_DOMAINS=www.dantar.it,dove.dantar.it

      - VALIDATION=http
      - EMAIL=daniele.tarini@gmail.com

    volumes:
      - /opt/swag/config:/config
      - /opt/web/dove/backend/data/images:/opt/dove/images:ro

    ports:
      - "80:80"
      - "443:443"

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost/"]
      interval: "30s"
      timeout: "10s"
      retries: 3

    networks:
      - proxy

    restart: unless-stopped

networks:
  proxy:
    external: true
